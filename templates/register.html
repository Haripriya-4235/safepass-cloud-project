{% extends "base.html" %}

{% block title %}Create Account - Women Safety Portal{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-3 mb-2">
                            <i class="fa-solid fa-user-plus fa-2x"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Create Account</h3>
                        <p class="text-muted small">Stay protected with cloud-assisted real-time safety</p>
                    </div>

                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Full Name</label>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Ananya Rao" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Mobile Phone Number</label>
                            <input type="tel" name="phone" class="form-control" placeholder="+91 9876543210" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold shadow-sm mb-3">
                            <i class="fa-solid fa-shield-check me-1"></i> Register & Enable Protection
                        </button>
                    </form>

                    <div class="text-center text-muted small">
                        Already have an account? <a href="{{ url_for('login') }}" class="text-danger fw-semibold text-decoration-none">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
