{% extends "base.html" %}

{% block title %}Sign In - Women Safety Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-3 mb-2">
                            <i class="fa-solid fa-shield-cat fa-2x"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Welcome Back</h3>
                        <p class="text-muted small">Women Safety & Safe Route Finder Portal</p>
                    </div>

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                                <input type="email" name="email" id="emailInput" class="form-control border-start-0 ps-0" placeholder="name@example.com" required value="priya@example.com">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" name="password" id="passwordInput" class="form-control border-start-0 ps-0" placeholder="••••••••" required value="demo123">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold shadow-sm mb-3">
                            <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
                        </button>
                    </form>

                    <!-- Fast Quick Demo Accounts -->
                    <div class="card bg-light border-0 rounded-3 p-3 mb-3">
                        <span class="text-muted small fw-bold mb-2 d-block"><i class="fa-solid fa-key me-1"></i> Quick Test Credentials:</span>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-outline-secondary btn-sm flex-fill" onclick="fillCredentials('priya@example.com', 'demo123')">
                                <i class="fa-solid fa-user me-1"></i> Demo User
                            </button>
                            <button type="button" class="btn btn-outline-dark btn-sm flex-fill" onclick="fillCredentials('admin@cloudsafety.org', 'admin123')">
                                <i class="fa-solid fa-user-shield me-1"></i> Cloud Admin
                            </button>
                        </div>
                    </div>

                    <div class="text-center text-muted small">
                        Don't have an account yet? <a href="{{ url_for('register') }}" class="text-danger fw-semibold text-decoration-none">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function fillCredentials(email, password) {
    document.getElementById('emailInput').value = email;
    document.getElementById('passwordInput').value = password;
}
</script>
{% endblock %}
