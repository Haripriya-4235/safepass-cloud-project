{% extends "base.html" %}

{% block title %}Sign In - Women Safety Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-3">
                        <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-3 mb-2" id="loginRoleBadge">
                            <i class="fa-solid fa-shield-cat fa-2x" id="loginRoleIcon"></i>
                        </div>
                        <h3 class="fw-bold text-dark" id="loginHeading">Welcome Back</h3>
                        <p class="text-muted small mb-0" id="loginSubheading">Women Safety & Safe Route Finder Portal</p>
                    </div>

                    <!-- 2 Role Switching Options (Citizen vs Admin) -->
                    <div class="p-1 mb-3 rounded-pill d-flex gap-1 border" style="background: #f1f5f9;">
                        <button type="button" class="btn btn-sm flex-fill fw-bold rounded-pill btn-danger text-white shadow-sm" id="roleUserBtn" onclick="switchLoginRole('user')">
                            <i class="fa-solid fa-user me-1"></i> Citizen / User
                        </button>
                        <button type="button" class="btn btn-sm flex-fill fw-semibold rounded-pill text-secondary bg-transparent border-0" id="roleAdminBtn" onclick="switchLoginRole('admin')">
                            <i class="fa-solid fa-shield-halved me-1"></i> Admin
                        </button>
                    </div>

                    <!-- Clear option alone -->
                    <div class="d-flex align-items-center justify-content-end mb-3">
                        <button type="button" class="btn btn-sm btn-outline-secondary px-3 py-1 rounded-pill" onclick="clearInputs()" title="Clear fields">
                            <i class="fa-solid fa-xmark me-1"></i> Clear
                        </button>
                    </div>

                    <form method="POST" action="{{ url_for('login') }}" autocomplete="off">
                        <!-- Dummy fields to absorb aggressive browser autofill -->
                        <input type="text" style="display:none" aria-hidden="true">
                        <input type="password" style="display:none" aria-hidden="true">

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                                <input type="email" name="email" id="emailInput" class="form-control border-start-0 ps-0" placeholder="Enter your email" required autocomplete="new-password" value="">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" name="password" id="passwordInput" class="form-control border-start-0 border-end-0 ps-0" placeholder="Enter your password" required autocomplete="new-password" value="">
                                <button type="button" class="btn btn-outline-secondary border-start-0 bg-light" onclick="togglePasswordVisibility()" title="Show/Hide Password">
                                    <i class="fa-solid fa-eye" id="togglePassIcon"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold shadow-sm mb-3" id="signInSubmitBtn">
                            <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In as Citizen
                        </button>
                    </form>

                    <div class="text-center text-muted small">
                        Don't have an account yet? <a href="{{ url_for('register') }}" class="text-danger fw-semibold text-decoration-none">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentRole = 'user';

function switchLoginRole(role) {
    currentRole = role;
    clearInputs();
    const userBtn = document.getElementById('roleUserBtn');
    const adminBtn = document.getElementById('roleAdminBtn');
    const roleBadge = document.getElementById('loginRoleBadge');
    const roleIcon = document.getElementById('loginRoleIcon');
    const subheading = document.getElementById('loginSubheading');
    const submitBtn = document.getElementById('signInSubmitBtn');

    if (role === 'admin') {
        // Admin active state
        adminBtn.className = 'btn btn-sm flex-fill fw-bold rounded-pill btn-dark text-warning shadow-sm';
        userBtn.className = 'btn btn-sm flex-fill fw-semibold rounded-pill text-secondary bg-transparent border-0';
        
        roleBadge.className = 'd-inline-flex align-items-center justify-content-center bg-warning-subtle text-warning rounded-circle p-3 mb-2';
        roleIcon.className = 'fa-solid fa-shield-halved fa-2x';
        subheading.textContent = 'Administrator & Security Console';
        submitBtn.className = 'btn btn-dark w-100 py-2 fw-bold text-warning shadow-sm mb-3';
        submitBtn.innerHTML = '<i class="fa-solid fa-shield-halved me-2"></i>Sign In as Admin';
    } else {
        // User active state
        userBtn.className = 'btn btn-sm flex-fill fw-bold rounded-pill btn-danger text-white shadow-sm';
        adminBtn.className = 'btn btn-sm flex-fill fw-semibold rounded-pill text-secondary bg-transparent border-0';
        
        roleBadge.className = 'd-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-3 mb-2';
        roleIcon.className = 'fa-solid fa-shield-cat fa-2x';
        subheading.textContent = 'Women Safety & Safe Route Finder Portal';
        submitBtn.className = 'btn btn-danger w-100 py-2 fw-semibold shadow-sm mb-3';
        submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-1"></i>Sign In as Citizen';
    }
}

function clearInputs() {
    document.getElementById('emailInput').value = '';
    document.getElementById('passwordInput').value = '';
}

function togglePasswordVisibility() {
    const input = document.getElementById('passwordInput');
    const icon = document.getElementById('togglePassIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
    }
}

// Ensure clean initial load
window.addEventListener('load', () => {
    setTimeout(() => {
        clearInputs();
    }, 50);
});
</script>
{% endblock %}
